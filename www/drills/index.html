<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raku Drills</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="/theme/shell.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="fly">🦋</span>
    <div>
      <h1>Raku Drills</h1>
      <p class="tagline">Train your Raku, one snippet at a time</p>
    </div>
  </div>
  <div class="top-right">
    <button id="themeBtn" class="icon-btn" title="Toggle theme">◐</button>
    <div id="engineChip" class="chip engine loading" title="Raku.js engine">
      <span class="dot"></span><span id="engineText">engine…</span>
    </div>
  </div>
</header>

<!-- ─────────────────────────────  HOME  ───────────────────────────── -->
<main id="home" class="screen">
  <p class="lede">
    Pick a level. Each drill shows a snippet — choose the answer, or type the
    missing piece. Every snippet is runnable, so you can poke at it until it clicks.
  </p>

  <div id="levelGrid" class="level-grid"></div>

  <div class="home-actions">
    <button id="mixBtn" class="btn primary big">Mixed drill · all levels</button>
    <button id="weakBtn" class="btn ghost big">Practise my weak spots</button>
  </div>

  <details class="stats-box">
    <summary>Overall progress</summary>
    <div id="overallStats" class="stats"></div>
    <button id="resetBtn" class="btn danger small">Reset all progress</button>
  </details>
</main>

<!-- ─────────────────────────────  DRILL  ──────────────────────────── -->
<main id="drill" class="screen" hidden>
  <div class="progress-rail"><div id="progressFill" class="progress-fill"></div></div>

  <div class="drill-head">
    <button id="quitBtn" class="btn ghost small">← Levels</button>
    <div class="head-meta">
      <span id="qLevel" class="chip level"></span>
      <span id="qTopic" class="chip topic"></span>
    </div>
    <div class="head-score">
      <span id="qCount" class="count"></span>
      <span id="qScore" class="score"></span>
    </div>
  </div>

  <section class="card">
    <p id="qText" class="q-text"></p>
    <div id="qCode" class="code-wrap" hidden></div>
    <div id="answerArea" class="answer-area"></div>
    <div id="verdict" class="verdict" hidden></div>
  </section>

  <div class="drill-actions">
    <button id="checkBtn" class="btn primary" disabled>Check</button>
    <button id="nextBtn" class="btn primary" hidden>Next →</button>
    <button id="playBtn" class="btn ghost">▶ Playground</button>
  </div>

  <!-- playground -->
  <section id="playground" class="playground" hidden>
    <div class="pg-head">
      <span class="pg-title">Playground — edit and run it</span>
      <div class="pg-btns">
        <button id="pgReset" class="btn ghost small">Reset</button>
        <button id="pgRun" class="btn primary small">▶ Run <kbd>⌘⏎</kbd></button>
        <button id="pgStop" class="btn danger small" hidden>Stop</button>
      </div>
    </div>
    <textarea id="pgSrc" class="pg-src" spellcheck="false"></textarea>
    <pre id="pgOut" class="pg-out"><span class="muted">Output appears here.</span></pre>
  </section>
</main>

<!-- ────────────────────────────  RESULTS  ─────────────────────────── -->
<main id="results" class="screen" hidden>
  <div class="result-hero">
    <div id="resultRing" class="ring"><span id="resultPct"></span></div>
    <h2 id="resultTitle"></h2>
    <p id="resultLine" class="muted"></p>
  </div>
  <div id="missList" class="miss-list"></div>
  <div class="home-actions">
    <button id="againBtn" class="btn primary big">Drill again</button>
    <button id="reviewBtn" class="btn ghost big" hidden>Review the misses</button>
    <button id="homeBtn" class="btn ghost big">← Levels</button>
  </div>
</main>

<script src="data/drills.js"></script>
<script src="js/highlight.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script src="/theme/shell.js" defer></script>
</body>
</html>
