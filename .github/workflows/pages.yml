name: Deploy to GitHub Pages

# Publishes www/ verbatim. The built artifacts (rakujs.js, rakujs.wasm,
# examples.js) are committed, so no build step is needed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub's own Pages template has them. With the upload and
  # the deploy in one job, deploy-pages listed the run's artifacts moments
  # after the upload and found none: run #362 failed that way three times
  # and #363 once, with the artifact shown on the run page each time.
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # One name per attempt: a re-run keeps the earlier attempt's artifact,
      # and deploy-pages refuses a run that holds two of a name. The deploy
      # job takes the name from here, so "Re-run failed jobs" on the deploy
      # alone still finds the artifact this job made.
      - id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
          name: ${{ steps.name.outputs.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
          # Pages sometimes spends longer than the default 10 minutes in
          # "syncing_files": the 2099ae35 deploy was cancelled there, two
          # earlier ones failed after the same 10 minutes, and one that
          # finished took 6. A slow sync is still a deploy.
          timeout: 1800000
