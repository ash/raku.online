name: Deploy to GitHub Pages

# Publishes www/ verbatim. The built artifacts (rakujs.js, rakujs.wasm,
# examples.js) are committed, so no build step is needed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
          # One name per attempt: a re-run keeps the earlier attempt's
          # artifact, and deploy-pages refuses a run that holds two of a name.
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Pages sometimes spends longer than the default 10 minutes in
          # "syncing_files": the 2099ae35 deploy was cancelled there, two
          # earlier ones failed after the same 10 minutes, and one that
          # finished took 6. A slow sync is still a deploy.
          timeout: 1800000
